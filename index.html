<style>

html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",Georgia,serif;line-height:1.7}
a{color:inherit}.sans{font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
nav a{white-space:nowrap;text-decoration:none;padding:6px 13px;border-radius:99px;font-size:14px;color:var(--mute)}
nav a.on{background:var(--dk);color:var(--bg)}
main{max-width:920px;margin:auto;padding:16px 16px 60px}
.hero{border-radius:22px;padding:56px 24px 40px;background:linear-gradient(160deg,var(--blue2),var(--oat) 60%,#e8d5b8);border:1px solid var(--line);position:relative;overflow:hidden}
.hero:after{content:"京";position:absolute;right:-6px;bottom:-60px;font-size:230px;opacity:.07;line-height:1}
.hero small{letter-spacing:.3em;color:var(--mute)}.hero h1{font-size:clamp(30px,8vw,52px);font-weight:400;margin:.2em 0;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
h2{font-weight:400;font-size:24px;margin:28px 0 6px;letter-spacing:.06em}h3{font-weight:500;margin:0}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--oat);color:var(--mute);margin:2px 4px 2px 0}
.warn{background:#f3e3cf;color:#5a3d1e;border-color:#dcc29a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#4a3a24;color:#f1ddbc}}
.tl{border-left:2px solid var(--line);margin-left:46px;padding-left:20px}
.st{position:relative;padding:4px 0 8px}.st:before{content:"";position:absolute;left:-27px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.st .t{position:absolute;left:-84px;top:5px;width:46px;text-align:right;font-size:13px;color:var(--mute)}
.ph{height:84px;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--oat));display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:26px;letter-spacing:.2em;margin-top:6px}
.go{font-size:12px;color:var(--mute);padding:2px 0 8px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--dk);color:var(--bg);border-color:var(--dk)}
input,select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.days .btn.on{background:var(--dk);color:var(--bg)}
.wall{columns:2 140px;column-gap:10px}.wall img{width:100%;border-radius:12px;margin-bottom:10px;cursor:zoom-in;display:block}
.lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:99}.lb img{max-width:94%;max-height:90%;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.big{font-size:28px}.done{text-decoration:line-through;opacity:.5}
</style></head><body>

R.budget=()=>{let B=ST.get("b",{rate:0.21,goal:150000,items:[],people:DATA.people}),ed=-1;

 const e=ed>=0?B.items[ed]:{cat:"餐飲",name:"",jpy:"",twd:"",who:B.people[0]};
 app.innerHTML=`<h2>旅行預算</h2><div class="card"><div class="row sans">匯率 1 JPY = <input id="rt" type="number" step="0.001" value="${B.rate}" style="width:80px"> TWD　預算 <input id="gl" type="number" value="${B.goal}" style="width:100px"> TWD</div>
 <p class="big">總花費 NT$ ${Math.round(tot).toLocaleString()}</p><p class="sans">預算差額：<b>${B.goal-tot>=0?"尚餘":"超支"} NT$ ${Math.abs(Math.round(B.goal-tot)).toLocaleString()}</b></p>
 ${bycat.map(([c,v])=>`<span class="chip">${c} ${Math.round(v).toLocaleString()}</span>`).join("")}</div>
 <div class="card"><b>${ed>=0?"修改支出":"新增支出"}</b><div class="row sans" style="margin-top:8px"><select id="c">${cats.map(c=>`<option ${c==e.cat?"selected":""}>${c}</option>`).join("")}</select><input id="n" placeholder="項目" value="${esc(e.name)}"><input id="j" type="number" placeholder="日幣 JPY" value="${e.jpy}" style="width:110px"><input id="w" type="number" placeholder="台幣 TWD" value="${e.twd}" style="width:110px"><select id="p">${B.people.map(p=>`<option ${p==e.who?"selected":""}>${esc(p)}</option>`).join("")}</select><button class="btn p" id="ok">${ed>=0?"儲存":"新增"}</button>${ed>=0?'<button class="btn" id="cx">取消</button>':""}</div></div>
 <div class="card" style="overflow-x:auto"><table class="sans"><tr><th>類別</th><th>項目</th><th>JPY</th><th>TWD</th><th>合計NT$</th><th>付款</th><th></th></tr>${B.items.map((i,k)=>`<tr><td>${i.cat}</td><td>${esc(i.name)}</td><td>${i.jpy||""}</td><td>${i.twd||""}</td><td>${Math.round(twd(i))}</td><td>${esc(i.who)}</td><td><button class="btn" data-e="${k}">改</button> <button class="btn" data-x="${k}">刪</button></td></tr>`).join("")||'<tr><td colspan=7>尚無支出</td></tr>'}</table></div>
 <div class="card"><b>誰付了多少</b>（點名字可改）<div class="row sans" style="margin-top:6px">${B.people.map((p,k)=>`<span class="chip" data-r="${k}" style="cursor:pointer">${esc(p)}：NT$ ${Math.round(per[k]).toLocaleString()}</span>`).join("")}</div><small class="sans">平均每人 NT$ ${Math.round(tot/B.people.length).toLocaleString()}</small></div>`;
 const sv=()=>ST.set("b",B);
 $("#rt").onchange=x=>{B.rate=+x.target.value||0.21;sv();draw()};$("#gl").onchange=x=>{B.goal=+x.target.value||0;sv();draw()};
 $("#ok").onclick=()=>{const it={cat:$("#c").value,name:$("#n").value,jpy:$("#j").value,twd:$("#w").value,who:$("#p").value};if(!it.name)return;ed>=0?B.items[ed]=it:B.items.push(it);ed=-1;sv();draw()};
 if($("#cx"))$("#cx").onclick=()=>{ed=-1;draw()};
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ed=+b.dataset.e;draw()});
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{B.items.splice(+b.dataset.x,1);sv();draw()});
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const k=+b.dataset.r,nn=prompt("成員名稱",B.people[k]);if(nn){B.items.forEach(i=>{if(i.who==B.people[k])i.who=nn});B.people[k]=nn;sv();draw()}})};draw()};
/* 相簿：圖片縮到 1000px 存入 IndexedDB */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("kj",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=rej});
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("p",m),o=f(t.objectStore("p"));t.oncomplete=()=>res(o.result);t.onerror=rej})};
const shrink=f=>new Promise(r=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};im.src=u});
let pd=1;
R.photos=async()=>{let all=[];try{all=await tx("readonly",s=>s.getAll())}catch(e){}
 const draw=()=>{const L=all.filter(p=>p.day==pd);app.innerHTML=`<h2>旅行相簿</h2><div class="days sans">${DATA.days.map(x=>`<button class="btn ${x.d==pd?"on":""}" data-d="${x.d}">DAY ${x.d}</button>`).join("")}</div>
 <div class="row sans" style="margin:10px 0"><label class="btn p">＋ 上傳照片<input id="up" type="file" accept="image/*" multiple hidden></label><small>存在這支手機／瀏覽器內（朋友看不到你的照片）</small></div>
 <div class="wall">${L.map(p=>`<img src="${p.src}" data-id="${p.id}">`).join("")||'<div class="card">這天還沒有照片</div>'}</div>`;
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{pd=+b.dataset.d;draw()});
 $("#up").onchange=async e=>{for(const f of e.target.files){const src=await shrink(f);try{await tx("readwrite",s=>s.add({day:pd,src}))}catch(x){}}try{all=await tx("readonly",s=>s.getAll())}catch(x){}draw()};
 document.querySelectorAll(".wall img").forEach(im=>{im.onclick=()=>{const l=document.createElement("div");l.className="lb";l.innerHTML=`<img src="${im.src}"><button class="btn" style="position:absolute;top:16px;right:16px" id="dl">刪除</button>`;l.onclick=ev=>{if(ev.target.id=="dl"){if(confirm("刪除這張？")){tx("readwrite",s=>s.delete(+im.dataset.id)).then(()=>{all=all.filter(p=>p.id!=im.dataset.id);l.remove();draw()})}}else l.remove()};document.body.append(l)}})};draw()};
R.list=()=>{let L=ST.get("l",DATA.todo.map(t=>({t,d:0})));const sv=()=>ST.set("l",L);
 const draw=()=>{const n=L.filter(x=>x.d).length;app.innerHTML=`<h2>旅行清單</h2><div class="card sans">完成 ${n} / ${L.length}<div class="row" style="margin-top:8px"><input id="ni" placeholder="新增項目" style="flex:1"><button class="btn p" id="ad">新增</button></div></div><div class="card">${L.map((x,k)=>`<div class="row" style="padding:5px 0"><input type="checkbox" data-k="${k}" ${x.d?"checked":""}><span class="${x.d?"done":""}" style="flex:1">${esc(x.t)}</span><button class="btn" data-x="${k}">✕</button></div>`).join("")}</div>`;
 $("#ad").onclick=()=>{const v=$("#ni").value.trim();if(v){L.push({t:v,d:0});sv();draw()}};
 document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{L[+c.dataset.k].d=c.checked?1:0;sv();draw()});
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{L.splice(+b.dataset.x,1);sv();draw()})};draw()};
R.weather=()=>{app.innerHTML=`<h2>天氣</h2><div class="card warn">網站發布後無法直接串接即時天氣，所以不顯示任何虛構數據。出發前請用下列官方／可靠來源查詢（含降雨機率、風速、警報）。</div><div class="grid">${DATA.weather.map(([n,u])=>`<a class="card btn" style="border-radius:18px" target="_blank" href="${u}">${n} ↗</a>`).join("")}</div>`};
R.check=()=>{const rows=[];DATA.days.forEach(d=>d.items.forEach(i=>{if(i.note&&i.note.startsWith("⚠")||(i.note||"").includes("⚠"))rows.push([d.d,i.t,i.n,i.note.replace("⚠","").trim()])}));
 const extra=[[0,"—","目前狀態","已無行程矛盾。剩餘為一般待確認項目：餐廳營業時間／價位、東寺票價、御金神社開放時間與交通、Day 6 的 15:00 飯店出發時間"]];
 app.innerHTML=`<h2>待確認事項</h2><div class="card warn">我沒有擅自更動任何已確定行程，只標出以下矛盾。</div>`+[...rows,...extra].map(r=>`<div class="card"><span class="chip">${r[0]?"DAY "+r[0]:"全程"}</span><b>${esc(r[2])}</b> ${r[1]!="—"?`<small>(${r[1]})</small>`:""}<br><small class="sans">${esc(r[3])}</small></div>`).join("")};
route();
</script></body></html>
